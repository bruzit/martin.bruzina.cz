---
name: Deploy

on:
  pull_request:
    paths: &paths
      - app/**
      - content/**
      - public/**
      - schemas/**
      - tests/**
      - headers.ts
      - lighthouserc.yaml
      - nuxt.config.ts
      - package.json
      - package-lock.json
      - playwright.config.ts
      - .github/workflows/deploy.yaml
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.event_name == 'push' && 'prod' || 'test' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/.output/public --no-progress '.output/public/**/*.html'
      - run: npx lhci autorun
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - id: deploy
        run: |
          npx --yes wrangler@4 pages deploy .output/public --project-name martin-bruzina-cz --branch "$BRANCH"
          jq -r 'select(.type == "pages-deploy-detailed") | "url=\(.url)"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref || 'main' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
      - if: github.event_name == 'pull_request'
        run: |
          echo "Preview: $URL"
          test "$(curl -sS --retry 5 -o /dev/null -w '%{http_code}' "$URL/")" = 200
          test "$(curl -sS --retry 5 -o /dev/null -w '%{http_code}' "$URL/smoke-missing-page")" = 404
          curl -sS --retry 5 -o /dev/null -D "$RUNNER_TEMP/headers" "$URL/"
          sed -n 's/^  //p' .output/public/_headers | while IFS= read -r header; do
            grep -qiF "$header" "$RUNNER_TEMP/headers" || { echo "Missing: $header"; exit 1; }
          done
        env:
          URL: ${{ steps.deploy.outputs.url }}
